<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07221d"/>
      <stop offset="50%" stop-color="#0f3c34"/>
      <stop offset="100%" stop-color="#081b17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)"/>

  <!-- Islamic Geometric Octagon Border -->
  <g transform="translate(256, 256) rotate(22.5)" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.35">
    <rect x="-180" y="-180" width="360" height="360" rx="30"/>
    <rect x="-180" y="-180" width="360" height="360" rx="30" transform="rotate(45)"/>
  </g>

  <!-- Islamic Dome / Arch Silhouette -->
  <path d="M 160 380 L 160 270 C 160 210, 256 160, 256 160 C 256 160, 352 210, 352 270 L 352 380 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" opacity="0.8"/>

  <!-- Crescent Moon & Star -->
  <path d="M 275 140 A 70 70 0 1 0 350 250 A 85 85 0 1 1 275 140 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <polygon points="345,160 352,175 368,175 355,185 360,200 345,190 330,200 335,185 322,175 338,175" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Tasbeeh Beads Loop Accent -->
  <circle cx="256" cy="315" r="7" fill="url(#goldGrad)"/>
  <circle cx="230" cy="325" r="6" fill="url(#goldGrad)"/>
  <circle cx="282" cy="325" r="6" fill="url(#goldGrad)"/>
  <circle cx="208" cy="342" r="5" fill="url(#goldGrad)"/>
  <circle cx="304" cy="342" r="5" fill="url(#goldGrad)"/>

  <!-- Text "gsاسلم" -->
  <text x="256" y="425" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" filter="url(#shadow)" letter-spacing="2">gsاسلم</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="20" fill="#9cd5c5" letter-spacing="4" opacity="0.9">ISLAMIC APP</text>
</svg>
